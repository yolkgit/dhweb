server {
    listen 80;
    client_max_body_size 50M;

    # Serve Static Files
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # Product detail pages are rendered by the backend with per-product SEO tags.
    # If the backend is unavailable, fall back to the static SPA shell.
    location ^~ /products/ {
        proxy_pass http://server:3004;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header X-Forwarded-Host $host;
        proxy_intercept_errors on;
        error_page 500 502 503 504 = @spa;
    }

    location @spa {
        root /usr/share/nginx/html;
        try_files /index.html =404;
    }

    # SEO files are generated per-domain by the backend
    location = /robots.txt {
        proxy_pass http://server:3004/robots.txt;
        proxy_set_header Host $host;
        # Preserve the original scheme from the outer proxy (https) instead of $scheme (http)
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header X-Forwarded-Host $host;
    }

    location = /sitemap.xml {
        proxy_pass http://server:3004/sitemap.xml;
        proxy_set_header Host $host;
        # Preserve the original scheme from the outer proxy (https) instead of $scheme (http)
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header X-Forwarded-Host $host;
    }

    # Proxy API requests to Backend
    location /api {
        proxy_pass http://server:3004;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    # Proxy Uploads
    location /uploads {
        proxy_pass http://server:3004;
    }
}
